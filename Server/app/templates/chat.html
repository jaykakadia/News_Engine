{% extends "base.html" %}

{% block title %}AI Chat - News Engine{% endblock %}
{% block header %}News Intelligence AI{% endblock %}

{% block content %}
<div class="chat-container">
    <div class="chat-messages" id="chat-box">
        <div class="message bot">
            Hello Jay! I am your News Intelligence AI. You can ask me questions about the latest news, or ask for summaries of specific topics.
        </div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="user-input" placeholder="Ask about the latest AI funding news...">
        <button class="btn btn-primary" onclick="sendMessage()">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>
</div>

<script>
    function sendMessage() {
        const input = document.getElementById('user-input');
        const box = document.getElementById('chat-box');
        const text = input.value.trim();
        
        if (text) {
            // Add user message
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text;
            box.appendChild(userMsg);
            
            // Clear input
            input.value = '';
            
            // Scroll to bottom
            box.scrollTop = box.scrollHeight;
            
            // Add a "typing" indicator
            const typingMsg = document.createElement('div');
            typingMsg.className = 'message bot';
            typingMsg.textContent = 'Thinking...';
            typingMsg.id = 'typing-indicator';
            box.appendChild(typingMsg);
            box.scrollTop = box.scrollHeight;
            
            // Call the real RAG backend
            fetch('/api/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ query: text })
            })
            .then(response => response.json())
            .then(data => {
                // Remove typing indicator
                const indicator = document.getElementById('typing-indicator');
                if (indicator) indicator.remove();
                
                // Add real bot response
                const botMsg = document.createElement('div');
                botMsg.className = 'message bot';
                
                if (data.error) {
                    botMsg.textContent = "Error: " + data.error;
                    botMsg.style.color = "red";
                } else {
                    // Simple formatting for markdown-like text from Gemini
                    let formattedText = data.response
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\n/g, '<br>');
                    botMsg.innerHTML = formattedText;
                }
                
                box.appendChild(botMsg);
                box.scrollTop = box.scrollHeight;
            })
            .catch(error => {
                const indicator = document.getElementById('typing-indicator');
                if (indicator) indicator.remove();
                
                const errorMsg = document.createElement('div');
                errorMsg.className = 'message bot';
                errorMsg.textContent = "Sorry, I couldn't connect to the server.";
                errorMsg.style.color = "red";
                box.appendChild(errorMsg);
            });
        }
    }

    document.getElementById('user-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendMessage();
    });
</script>
{% endblock %}
