<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}News Engine{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-bolt"></i>
                <span>News Engine</span>
            </div>
            <nav>
                <ul class="nav-links">
                    <li class="nav-item">
                        <a href="{{ url_for('dashboard.index') }}" class="nav-link {% if request.path == '/' %}active{% endif %}">
                            <i class="fas fa-newspaper"></i>
                            <span>Feed</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('dashboard.get_dashboard') }}" class="nav-link {% if request.path == '/dashboard/' %}active{% endif %}">
                            <i class="fas fa-chart-line"></i>
                            <span>Analytics</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('chat.chat_view') }}" class="nav-link {% if request.path == '/chat/' %}active{% endif %}">
                            <i class="fas fa-comment-dots"></i>
                            <span>AI Chat</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('alerts.alerts_page') }}" class="nav-link {% if request.path == '/alerts/' %}active{% endif %}">
                            <i class="fas fa-bell"></i>
                            <span>Alerts</span>
                            {% if unread_alerts_count > 0 %}
                            <span style="background: #f87171; color: #fff; font-size: 0.65rem; font-weight: 700; padding: 0.15rem 0.45rem; border-radius: 1rem; margin-left: auto;">{{ unread_alerts_count }}</span>
                            {% endif %}
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('alerts.interests_page') }}" class="nav-link {% if request.path == '/interests/' %}active{% endif %}">
                            <i class="fas fa-cog"></i>
                            <span>Settings</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header>
                <h1>{% block header %}{% endblock %}</h1>
                <div class="user-profile" style="display: flex; align-items: center; gap: 1rem;">
                    <span style="font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em;">
                        {{ current_user_role }}
                    </span>
                    <button class="btn btn-primary" style="pointer-events: none;">
                        <i class="fas fa-user"></i>
                        <span>{{ current_user_email if current_user_email else current_user_name }}</span>
                    </button>
                    <a href="{{ url_for('auth.logout') }}" class="btn" style="background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); font-size: 0.85rem;">
                        <i class="fas fa-sign-out-alt"></i>
                    </a>
                </div>
            </header>

            <section class="content">
                {% block content %}{% endblock %}
            </section>
        </main>
    </div>
</body>
</html>
